name: Windows tests and desktop build

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: write  # only the small, verified documentation preview is committed

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Core and native-layout tests
        run: python -m pytest -q --junitxml=dist/test-results.xml
      - name: Construct all five UI pages without keyboard input
        run: python scripts/smoke_ui.py --screenshots dist/screenshots
      - name: Install installer compiler
        run: choco install innosetup --yes --no-progress
      - name: Build portable ZIP and per-user installer
        run: python scripts/build_windows.py --skip-tests --installer
      - name: Smoke-test packaged portable EXE
        shell: pwsh
        run: |
          Expand-Archive dist/MinecraftAutoAdvertiser-Portable-1.0.0.zip -DestinationPath dist/portable-check
          $p = Start-Process -FilePath "$PWD/dist/portable-check/MinecraftAutoAdvertiser.exe" -ArgumentList @('--smoke-test') -PassThru
          if (-not $p.WaitForExit(45000)) { $p.Kill(); throw 'Portable EXE smoke timeout' }
          if ($p.ExitCode -ne 0) {
            $log = Get-Content 'dist/portable-check/data/logs/application.log' -Raw -ErrorAction SilentlyContinue
            if ($log) { Write-Output ('::error title=Portable startup::' + [Uri]::EscapeDataString($log.Substring(0, [Math]::Min(5000, $log.Length)))) }
            throw "Portable EXE exited $($p.ExitCode)"
          }
          if (-not (Test-Path 'dist/portable-check/data/advertiser.db')) { throw 'Portable data routing failed' }
      - name: Install and smoke-test setup output
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath "$PWD/dist/MinecraftAutoAdvertiser-Setup-1.0.0.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Installer exited $($setup.ExitCode)" }
          $exe = "$env:LOCALAPPDATA/Programs/MinecraftAutoAdvertiser/MinecraftAutoAdvertiser.exe"
          $p = Start-Process -FilePath $exe -ArgumentList @('--smoke-test','--data-dir',"$PWD/dist/installed-data") -PassThru
          if (-not $p.WaitForExit(45000)) { $p.Kill(); throw 'Installed EXE smoke timeout' }
          if ($p.ExitCode -ne 0) { throw "Installed EXE exited $($p.ExitCode)" }
          if (Test-Path "$env:LOCALAPPDATA/Programs/MinecraftAutoAdvertiser/advertiser.db") { throw 'Data written beside installed EXE' }
      - name: Publish small verified UI preview
        if: github.ref_name == 'arena/e89ca290-minecraft-reklam-bot'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_preview.py
      - name: Upload verified desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MinecraftAutoAdvertiser-Windows
          path: |
            dist/MinecraftAutoAdvertiser-Portable-1.0.0.zip
            dist/MinecraftAutoAdvertiser-Setup-1.0.0.exe
            dist/screenshots/
            dist/test-results.xml
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Windows-diagnostics
          path: |
            dist/
            build/
          if-no-files-found: ignore
          retention-days: 7
